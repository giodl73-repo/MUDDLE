[package]
name = "muddle-browser-player"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["player-entry"]
player-entry = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
muddle-core = { path = "../../crates/muddle-core" }
muddle-cli = { path = "../../crates/muddle-cli" }
muddle-mock-sim = { path = "../../crates/muddle-mock-sim" }
muddle-banish-spike = { path = "../../crates/muddle-banish-spike" }
muddle-amaze-spike = { path = "../../crates/muddle-amaze-spike" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
